# ===================================================================
# LocalFix Backend Configuration (Phase 4 MySQL Integration)
# ===================================================================

spring.application.name=localfix-backend
server.port=8080

# Import local git-ignored overrides if present (e.g. local credentials)
spring.config.import=optional:application-local.properties

# -------------------------------------------------------------------
# MySQL DataSource Configuration
# -------------------------------------------------------------------
# Reads from environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
# 'createDatabaseIfNotExist=true' automatically creates localfix_db if not present.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/localfix_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# -------------------------------------------------------------------
# 'update': automatically creates or updates tables based on JPA entities without dropping existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.localfix=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -------------------------------------------------------------------
# File Upload Configuration (Phase 8 Image Uploads)
# -------------------------------------------------------------------
# Local storage directory for civic issue photograph attachments
localfix.upload.dir=${LOCALFIX_UPLOAD_DIR:uploads}
localfix.upload.max-file-size=5MB

# Spring Boot Multipart Upload Limits (Enforced at Servlet container level)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
